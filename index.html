<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sarah - Magical Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at bottom, #2b1055 0%, #080314 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            perspective: 1000px;
        }

        /* سماء الليل والنجوم المحسنة */
        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px #fff, 0 0 20px #fff; }
            100% { opacity: 0.3; transform: scale(0.8); }
        }

        .stars, .stars2, .stars3 {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle infinite ease-in-out;
        }

        /* حاوية المحتوى */
        .container {
            text-align: center;
            z-index: 10;
            position: relative;
        }

        /* تأثيرات النص متعدد اللغات */
        .greeting-container {
            margin-bottom: 60px;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .languages {
            position: relative;
            height: 70px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lang {
            position: absolute;
            font-family: 'Dancing Script', cursive;
            font-size: 4.5rem;
            color: #fff;
            text-shadow: 0 0 10px #ff66b2, 0 0 20px #ff66b2, 0 0 30px #ff1a8c, 0 0 50px #ff1a8c;
            opacity: 0;
            animation: cycleText 16s infinite;
            white-space: nowrap;
        }

        /* توقيت اللغات (16 ثانية إجمالاً، 4 ثوانٍ لكل لغة) */
        .lang-en { animation-delay: 0s; }
        .lang-fr { animation-delay: 4s; }
        .lang-es { animation-delay: 8s; }
        .lang-it { animation-delay: 12s; }

        @keyframes cycleText {
            0% { opacity: 0; transform: translateY(20px) scale(0.9); filter: blur(5px); }
            5% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
            20% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
            25% { opacity: 0; transform: translateY(-20px) scale(1.1); filter: blur(5px); }
            100% { opacity: 0; }
        }

        .name {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 5rem;
            color: #99ffff;
            text-shadow: 0 0 10px #00e6e6, 0 0 20px #00e6e6, 0 0 40px #00b3b3, 0 0 80px #00b3b3;
            margin-top: 10px;
            animation: pulseName 3s infinite alternate;
            letter-spacing: 5px;
        }

        @keyframes pulseName {
            0% { text-shadow: 0 0 10px #00e6e6, 0 0 20px #00e6e6; transform: scale(1); }
            100% { text-shadow: 0 0 15px #00e6e6, 0 0 30px #00e6e6, 0 0 50px #00e6e6; transform: scale(1.05); }
        }

        /* هالة سحرية خلف الكعكة */
        .magic-aura {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 102, 178, 0.2) 0%, rgba(153, 255, 255, 0.1) 40%, transparent 70%);
            border-radius: 50%;
            z-index: 1;
            animation: rotateAura 10s linear infinite;
        }

        @keyframes rotateAura {
            0% { transform: translateX(-50%) rotate(0deg) scale(1); }
            50% { transform: translateX(-50%) rotate(180deg) scale(1.1); }
            100% { transform: translateX(-50%) rotate(360deg) scale(1); }
        }

        /* الكعكة (محسنة) */
        .cake-container {
            position: relative;
            width: 300px;
            height: 250px;
            margin: 0 auto;
            z-index: 5;
            animation: floatCake 6s ease-in-out infinite;
        }

        @keyframes floatCake {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .cake {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
        }

        .plate {
            position: absolute;
            bottom: -20px;
            left: -35px;
            width: 270px;
            height: 30px;
            background: linear-gradient(to bottom, #d9d9d9, #737373);
            border-radius: 50%;
            box-shadow: 0 15px 25px rgba(0,0,0,0.8), inset 0 5px 10px rgba(255,255,255,0.5);
            z-index: 1;
        }

        .layer {
            position: absolute;
            left: 0;
            width: 200px;
            border-radius: 15px;
            box-shadow: inset 0 -15px 25px rgba(0,0,0,0.2), inset 0 5px 10px rgba(255,255,255,0.3);
        }

        .bottom-layer {
            bottom: 0;
            height: 70px;
            background: linear-gradient(to right, #ff66b2, #ff99cc);
            z-index: 2;
        }

        .middle-layer {
            bottom: 70px;
            left: 15px;
            width: 170px;
            height: 60px;
            background: linear-gradient(to right, #ff4dff, #ff80ff);
            z-index: 3;
        }

        .top-layer {
            bottom: 130px;
            left: 30px;
            width: 140px;
            height: 50px;
            background: linear-gradient(to right, #cc33ff, #e680ff);
            z-index: 4;
        }

        .icing {
            position: absolute;
            bottom: 175px;
            left: 25px;
            width: 150px;
            height: 25px;
            background: #fff;
            border-radius: 25px 25px 0 0;
            z-index: 5;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }

        .drip {
            position: absolute;
            background: #fff;
            width: 22px;
            border-radius: 0 0 25px 25px;
            z-index: 5;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
        }

        .drip-1 { height: 45px; left: 35px; bottom: 135px; }
        .drip-2 { height: 75px; left: 75px; bottom: 105px; }
        .drip-3 { height: 35px; left: 115px; bottom: 145px; }
        .drip-4 { height: 60px; left: 155px; bottom: 120px; }

        /* شمعة واقعية */
        .candle {
            position: absolute;
            bottom: 200px;
            left: 95px;
            width: 12px;
            height: 45px;
            background: repeating-linear-gradient(
                -45deg,
                #ffffff,
                #ffffff 6px,
                #ff0066 6px,
                #ff0066 12px
            );
            border-radius: 3px;
            z-index: 6;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        .candle::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 5px;
            width: 2px;
            height: 5px;
            background: #333;
        }

        .flame {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 28px;
            background: #ffcc00;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #ffcc00, 0 0 30px #ff9900, 0 0 50px #ff3300;
            animation: flicker 0.6s ease-in-out infinite alternate;
            z-index: 7;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 0.9; }
            50% { transform: translateX(-50%) scale(1.1) rotate(0deg); opacity: 1; box-shadow: 0 0 20px #ffcc00, 0 0 40px #ff9900, 0 0 60px #ff3300; }
            100% { transform: translateX(-50%) scale(0.9) rotate(2deg); opacity: 0.8; }
        }

        /* جزيئات الإضاءة المتطايرة (Sparkles) */
        .sparkle {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px #ff99ffff;
            animation: floatUp infinite linear;
            z-index: 8;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0); opacity: 0; }
            50% { opacity: 1; transform: translateY(-50px) scale(1); }
            100% { transform: translateY(-100px) scale(0); opacity: 0; }
        }

    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="magic-aura"></div>

    <div class="container">
        <div class="greeting-container">
            <div class="languages">
                <span class="lang lang-en">Happy Birthday</span>
                <span class="lang lang-fr">Joyeux Anniversaire</span>
                <span class="lang lang-es">Feliz Cumpleaños</span>
                <span class="lang lang-it">Buon Compleanno</span>
            </div>
            <div class="name">SARAH</div>
        </div>
        
        <div class="cake-container">
            <div class="cake">
                <div class="plate"></div>
                <div class="layer bottom-layer"></div>
                <div class="layer middle-layer"></div>
                <div class="layer top-layer"></div>
                <div class="icing"></div>
                <div class="drip drip-1"></div>
                <div class="drip drip-2"></div>
                <div class="drip drip-3"></div>
                <div class="drip drip-4"></div>
                <div class="candle">
                    <div class="flame"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- إضافة النجوم والجزيئات عبر جافاسكربت بسيط مدمج للحصول على عشوائية وجمالية أفضل -->
    <script>
        const starsContainer = document.getElementById('stars');
        
        // توليد النجوم
        for (let i = 0; i < 150; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsContainer.appendChild(star);
        }

        // توليد جزيئات ضوئية متطايرة حول الكعكة
        const container = document.querySelector('.container');
        setInterval(() => {
            let sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.width = Math.random() * 6 + 2 + 'px';
            sparkle.style.height = sparkle.style.width;
            sparkle.style.left = (Math.random() * 300 - 150) + 'px'; // حول الكعكة
            sparkle.style.bottom = '100px';
            sparkle.style.animationDuration = (Math.random() * 2 + 2) + 's';
            
            container.appendChild(sparkle);
            
            setTimeout(() => {
                sparkle.remove();
            }, 4000);
        }, 300);
    </script>
</body>
</html>
